<!DOCTYPE html>
<html lang="uz" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gano Shop</title>
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">
        <div class="logo-leaf">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10"/><path d="M12 8c0 4-3 7-7 8"/></svg>
        </div>
        Gano Shop
    </div>
    <div class="header-right">
        <div class="lang-wrap">
            <button id="lang-btn" class="icon-btn" title="Til" style="font-size:16px">🇺🇿</button>
            <div id="lang-dropdown" class="lang-dropdown hidden">
                <button onclick="setLang('uz')">🇺🇿 O'zbek</button>
                <button onclick="setLang('ru')">🇷🇺 Русский</button>
            </div>
        </div>
        <button id="theme-btn" class="icon-btn" title="Mavzu">
            <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="cart-btn-wrap">
            <button id="cart-btn" class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </button>
            <span id="cart-badge" class="cart-badge hidden">0</span>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="hero-eyebrow" id="hero-badge">Gano Excel — №1 Dunyoda</div>
        <h1 id="hero-title">Sog'liqni <em>Tabiiy</em> Kuchga<br>Aylantiring</h1>
        <p id="hero-sub">Ganoderma Lucidum asosidagi premium mahsulotlar</p>
    </section>

    <div class="search-wrap">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Mahsulot qidiring...">
        </div>
    </div>
    <div id="suggestions" class="suggestions hidden"></div>

    <section id="products-grid" class="product-grid"></section>
</main>

<div id="modal-overlay" class="overlay"></div>
<div id="product-sheet" class="sheet">
    <div class="sheet-handle"></div>
    <button class="sheet-close" id="close-sheet">&times;</button>
    <div class="sheet-scroll">
        <div id="gallery-row" class="gallery-row"></div>
        <div id="detail-body" class="detail-body"></div>
    </div>
</div>

<div id="viewer" class="viewer">
    <button class="viewer-close" id="viewer-close">&times;</button>
    <img id="viewer-img" src="" alt="">
</div>

<div id="cart-overlay" class="cart-overlay"></div>
<div id="cart-sheet" class="cart-sheet">
    <div class="cart-top">
        <h2 id="cart-title-txt">Savat</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="icon-btn" id="clear-cart-btn" title="Tozalash" style="color: var(--muted);">
                <svg viewBox="0 0 24 24" style="width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
            <button class="icon-btn" id="close-cart">&times;</button>
        </div>
    </div>
    <div class="receipt">
        <div id="cart-items" class="cart-items"></div>
        <hr class="receipt-dashes">
        <div class="cart-total-row">
            <span id="cart-total-label">Jami:</span>
            <span id="cart-total-val">0 so'm</span>
        </div>
    </div>
    <div class="cart-footer">
        <button id="checkout-btn" class="btn-checkout">Buyurtma berish</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
