<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gano Shop | Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header blur-effect">
        <div class="logo">Gano Shop.</div>

        <div class="header-controls">
            <div class="lang-selector">
                <button id="lang-btn" class="control-btn">🇺🇸 EN</button>
                <div id="lang-dropdown" class="lang-dropdown hidden">
                    <button onclick="changeLanguage('en')">🇺🇸 English</button>
                    <button onclick="changeLanguage('ru')">🇷🇺 Русский</button>
                    <button onclick="changeLanguage('uz')">🇺🇿 O'zbek</button>
                </div>
            </div>

            <button id="theme-btn" class="control-btn" aria-label="Toggle Theme">
                <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>

            <button id="cart-btn" class="cart-btn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span id="cart-badge" class="cart-badge hidden">0</span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 data-i18n="hero-title">Natural Wellness<br>For Everyday Life</h1>
                <p data-i18n="hero-subtitle">Curated essentials for your mind and body.</p>
            </div>
        </section>

        <section class="categories">
            <div class="category-scroll">
                <button class="category-chip active" data-category="all" data-i18n="cat-all">All</button>
                <button class="category-chip" data-category="health" data-i18n="cat-health">Health</button>
                <button class="category-chip" data-category="coffee" data-i18n="cat-coffee">Coffee</button>
                <button class="category-chip" data-category="tea" data-i18n="cat-tea">Tea</button>
            </div>
        </section>

        <section class="search-section">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="Search wellness products...">
            </div>
        </section>

        <section id="products-section" class="product-grid">
            </section>
    </main>

    <div id="product-modal" class="modal-overlay hidden">
        <div class="modal-content" id="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="modal-gallery" id="modal-gallery"></div>
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-price" class="price"></p>
                <div class="modal-desc" id="modal-desc"></div>
                <div class="modal-benefits" id="modal-benefits"></div>

                <div id="modal-action-container" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <div id="image-viewer" class="image-viewer hidden">
        <button id="close-viewer" class="close-viewer-btn">&times;</button>
        <img id="viewer-img" src="" alt="Zoomed Image">
    </div>

    <div id="cart-drawer" class="cart-drawer hidden">
        <div class="cart-header">
            <h2 data-i18n="cart-title">Your Cart</h2>
            <button id="close-cart" class="close-btn">&times;</button>
        </div>

        <div class="receipt-paper">
            <div id="cart-items" class="cart-items"></div>
            <div class="receipt-divider"></div>
            <div class="cart-total">
                <span data-i18n="cart-total">Total</span>
                <span id="cart-total-price">$0.00</span>
            </div>
        </div>

        <div class="cart-footer">
            <button id="checkout-btn" class="btn-primary full-width" data-i18n="checkout-btn">Checkout</button>
        </div>
    </div>
    <div id="cart-overlay" class="cart-overlay hidden"></div>

    <script src="script.js"></script>
</body>
</html>
